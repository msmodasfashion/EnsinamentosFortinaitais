<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Estudos & Provas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }
        .status-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #00f2fe;
        }
        .grid-anos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card-ano {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        .card-ano:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            transform: translateY(-50px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
        }
        /* Modal Pix */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: #1a1736; border: 1px solid #4facfe; padding: 35px; border-radius: 20px;
            max-width: 420px; width: 90%; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        .pix-key {
            background: rgba(0,0,0,0.5); border: 1px dashed #00f2fe; padding: 12px;
            border-radius: 10px; font-size: 1.1rem; color: #00f2fe; font-weight: 800; margin: 20px 0;
        }
        .btn-pix {
            background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: #0f0c29;
            padding: 12px; width: 100%; font-weight: 800; border-radius: 12px; cursor: pointer; text-transform: uppercase;
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #00f2fe; color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800;
            transition: transform 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 2000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header>
        <div class="logo">FORTNITE STUDY BATTLE</div>
        <div id="timerRelogio" style="font-weight: 600; color: #aaa; font-size: 0.9rem;">Reseta em: 05:00:00</div>
    </header>

    <div class="container">
        <div class="status-box">
            <div>
                <h3 id="saudacaoUser" style="font-weight: 800; font-size: 1.1rem;">Jogador</h3>
                <p style="color: #aaa; font-size: 0.85rem;">Tentativas grátis restantes hoje: <span id="vidasRestantes" style="color: #00f2fe; font-weight: 900;">3</span></p>
            </div>
            <button onclick="abrirModalPix()" style="background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; color: white; padding: 10px 20px; font-weight: 800; border-radius: 12px; cursor: pointer;">Liberar Mais Provas</button>
        </div>

        <div class="section-title">Escolha o seu Ano / Nível de Batalha:</div>
        <div class="grid-anos">
            <a href="provas.html?nivel=7ano" class="card-ano" onclick="verificarLimite(event)">7º Ano</a>
            <a href="provas.html?nivel=8ano" class="card-ano" onclick="verificarLimite(event)">8º Ano</a>
            <a href="provas.html?nivel=9ano" class="card-ano" onclick="verificarLimite(event)">9º Ano</a>
            <a href="provas.html?nivel=enem" class="card-ano" onclick="verificarLimite(event)">ENEM 🏆</a>
        </div>
    </div>

    <!-- Modal Pix -->
    <div class="modal-overlay" id="modalPix">
        <div class="modal">
            <h2 style="color: #ff416c; margin-bottom: 10px; font-weight: 900;">Vidas Esgotadas!</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Suas tentativas acabaram. Para continuar treinando agora, faça um Pix para a chave abaixo:</p>
            <div class="pix-key">12992446936</div>
            <button class="btn-pix" onclick="copiarPix()">Copiar Chave Pix (Telefone)</button>
            <button onclick="fecharModalPix()" style="background: transparent; border: none; color: #aaa; margin-top: 15px; cursor: pointer; font-weight: 600;">Fechar</button>
        </div>
    </div>

    <div class="toast" id="toastNotification">Chave Pix copiada! 🚀</div>

    <script>
        const nickSalvo = localStorage.getItem('fortnite_user') || 'Convidado';
        document.getElementById('saudacaoUser').innerText = `Player: ${nickSalvo}`;

        // Sistema de Limite de Vidas e Timer de 5 Horas
        let dadosUser = JSON.parse(localStorage.getItem('fortnite_study_user')) || {
            vidas: 3,
            tempoExpiracao: new Date().getTime() + (5 * 60 * 60 * 1000)
        };

        function checarResetTimer() {
            let agora = new Date().getTime();
            if (agora > dadosUser.tempoExpiracao) {
                dadosUser.vidas = 3;
                dadosUser.tempoExpiracao = agora + (5 * 60 * 60 * 1000);
                localStorage.setItem('fortnite_study_user', JSON.stringify(dadosUser));
            }
        }

        checarResetTimer();
        document.getElementById('vidasRestantes').innerText = dadosUser.vidas;

        setInterval(() => {
            let agora = new Date().getTime();
            let distancia = dadosUser.tempoExpiracao - agora;
            if (distancia < 0) {
                checarResetTimer();
                distancia = 5 * 60 * 60 * 1000;
            }
            let horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            let segundos = Math.floor((distancia % (1000 * 60)) / 1000);
            
            document.getElementById('timerRelogio').innerText = `Reseta em: ${String(horas).padStart(2,'0')}:${String(minutos).padStart(2,'0')}:${String(segundos).padStart(2,'0')}`;
        }, 1000);

        function verificarLimite(event) {
            checarResetTimer();
            if (dadosUser.vidas <= 0) {
                event.preventDefault();
                abrirModalPix();
            } else {
                dadosUser.vidas--;
                localStorage.setItem('fortnite_study_user', JSON.stringify(dadosUser));
            }
        }

        function abrirModalPix() { document.getElementById('modalPix').style.display = 'flex'; }
        function fecharModalPix() { document.getElementById('modalPix').style.display = 'none'; }
        function copiarPix() {
            navigator.clipboard.writeText("12992446936").then(() => {
                const toast = document.getElementById('toastNotification');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            });
        }
    </script>
</body>
</html>
