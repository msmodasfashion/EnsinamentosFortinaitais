<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fortnite Estudos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .login-card p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            font-size: 0.8rem;
            color: #4facfe;
            font-weight: 600;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-top: 5px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .btn-submit {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: #0f0c29;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>FORTNITE BATTLE</h1>
        <p>Faça login para entrar na sala de estudos</p>
        
        <form onsut="fazerLogin(event)" action="index.html">
            <div class="input-group">
                <label>Nickname / Jogador</label>
                <input type="text" id="nickUser" required placeholder="Ex: Player_123">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" onclick="salvarNick()">Entrar no Jogo</button>
        </form>
    </div>

    <script>
        function salvarNick() {
            const nick = document.getElementById('nickUser').value;
            if(nick) {
                localStorage.setItem('fortnite_user', nick);
            }
        }
    </script>
</body>
</html>
